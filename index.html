<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0F1F">
<title>NextGen Learning</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NextGen Learning">

<style>
:root{--bg:#0A0F1F;--surface:#111833;--surface2:#172044;--ink:#EEF2FF;--mut:#9AA6C9;--line:#26305A;--gold:#FF8A3D;--neon:#35D0BA;--green:#1B2B63;--brown:#0F1630;--red:#FF6B6B;--f:'Rajdhani','Noto Sans Devanagari',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:72px;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 'Noto Sans Devanagari','Plus Jakarta Sans',sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));counter-reset:sec}
.w{max-width:1040px;margin:0 auto;padding:0 20px}a{color:inherit}.mut{color:var(--mut)}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:rgba(10,15,31,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;justify-content:space-between;height:62px;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font:700 20px var(--f);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;color:var(--ink);white-space:nowrap;min-width:0}
.logo img{height:42px;width:auto;filter:drop-shadow(0 0 6px rgba(255,138,61,.45))}
.logo span{overflow:hidden;text-overflow:ellipsis}
nav.top{display:none;gap:16px;font:600 15px var(--f);letter-spacing:.07em;text-transform:uppercase}
nav.top a{color:var(--mut);text-decoration:none}nav.top a:hover{color:var(--neon)}
@media(min-width:960px){nav.top{display:flex}}
.cut{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
#lang{background:var(--gold);color:#1f0e00;border:0;padding:8px 14px;font:700 15px var(--f);letter-spacing:.05em;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.hero{position:relative;overflow:hidden;padding:34px 0 44px;border-bottom:1px solid var(--line);background-color:var(--bg);background-image:radial-gradient(520px 280px at 85% 0%,rgba(53,208,186,.20),transparent 70%),radial-gradient(460px 260px at 0% 100%,rgba(255,138,61,.14),transparent 70%),linear-gradient(rgba(53,208,186,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(53,208,186,.06) 1px,transparent 1px);background-size:auto,auto,34px 34px,34px 34px}
.hero .w{display:grid;gap:20px;grid-template-columns:1fr;align-items:center}
.herologo{width:min(170px,44vw);justify-self:center;filter:drop-shadow(0 0 22px rgba(255,138,61,.35))}
@media(prefers-reduced-motion:no-preference){.herologo{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}}
.hero h1{font:700 clamp(34px,8vw,66px)/1.05 var(--f);text-transform:uppercase;margin:0 0 12px;background:linear-gradient(90deg,#fff 30%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:46ch;margin:0 0 22px}
.btn{display:inline-block;background:var(--gold);color:#1f0e00;padding:13px 28px;font:700 18px var(--f);letter-spacing:.07em;text-transform:uppercase;text-decoration:none;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.btn:hover{filter:brightness(1.12)}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:24px;max-width:520px}
.hud div{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--neon);padding:8px 6px;text-align:center}
.hud b{display:block;font:700 19px var(--f);color:var(--gold)}.hud span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
@media(min-width:860px){.hero .w{grid-template-columns:1.25fr .75fr}.herologo{width:260px;order:2}}
section{padding:50px 0;counter-increment:sec}.alt{background:var(--surface);border-block:1px solid var(--line)}
section h2{font:700 clamp(26px,5vw,38px)/1.1 var(--f);text-transform:uppercase;letter-spacing:.03em;margin:0 0 20px;color:var(--ink)}
section h2::before{content:"0" counter(sec) " //";display:block;font-size:14px;letter-spacing:.25em;color:var(--neon);margin-bottom:4px}
section h2::after{content:"";display:block;width:64px;height:3px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:8px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--neon);border-radius:6px;padding:16px}
.card h3{margin:0 0 2px;font:700 21px var(--f);letter-spacing:.03em}.card small{color:var(--gold);font-weight:600}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;margin-bottom:10px;border:1px solid var(--line);background:var(--surface2)}
ul.chips{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.chips li{background:var(--surface2);border:1px solid var(--line);padding:11px 14px;font-weight:600}.chips li::before{content:"▸ ";color:var(--neon)}
table{border-collapse:collapse;width:100%;max-width:640px;background:var(--surface)}
td,th{padding:10px 12px;border:1px solid var(--line);text-align:left;font-size:15px;vertical-align:top}
th{background:var(--surface2);color:var(--gold);font:700 15px var(--f);text-transform:uppercase;letter-spacing:.08em}
.gal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.n{padding:12px 14px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);max-width:720px}
.n time{color:var(--gold);font:700 14px var(--f);letter-spacing:.1em}.n b{display:block}
footer{border-top:1px solid var(--line);padding:24px 0 30px;color:var(--mut);font-size:14px;background:#070A16}a.adm{color:var(--gold)}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(10,15,31,.96);backdrop-filter:blur(8px);border-top:1px solid var(--neon);padding-bottom:env(safe-area-inset-bottom,0px)}
#bar button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 6px;font:700 13px var(--f);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#bar button span{font-size:20px;line-height:1}#bar button.on{color:var(--gold);text-shadow:0 0 10px rgba(255,138,61,.6)}
#sheet{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}#sheet[hidden]{display:none}
.sh{background:var(--bg);width:100%;border-radius:16px 16px 0 0;border-top:2px solid var(--neon);padding:16px 14px calc(88px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto}
.fold{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.fold summary{padding:12px 14px;font:700 18px var(--f);letter-spacing:.05em;text-transform:uppercase;color:var(--gold);cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}.fold summary::after{content:"▾";float:right;color:var(--neon)}.fold[open] summary::after{content:"▴"}
.fold .shg{padding:0 10px 10px}
.shg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shg button{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;font:600 15px 'Noto Sans Devanagari','Plus Jakarta Sans',sans-serif;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.shg button:hover{border-color:var(--neon)}
#panelView{padding:24px 0 40px;min-height:70vh}
#panelView h2{font:700 30px var(--f);text-transform:uppercase;margin:0 0 4px;color:var(--gold)}
#panelView input,#panelView select,#panelView textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);margin:3px 0 10px;font:inherit;color:var(--ink)}
#panelView label{display:block;font-size:14px;color:var(--mut)}
#panelView button{background:var(--green);color:#fff;border:1px solid var(--neon);border-radius:6px;padding:9px 14px;cursor:pointer;font:600 15px 'Noto Sans Devanagari','Plus Jakarta Sans',sans-serif}
#panelView button.g{background:var(--gold);color:#1f0e00;border-color:var(--gold)}
#panelView button.r{background:#7A2323;border-color:#7A2323;padding:5px 9px;font-size:13px}
#panelView button:disabled{opacity:.6}
#panelView .f{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#panelView table{max-width:none;font-size:14px}#panelView td select{margin:0;padding:5px}#panelView td button{margin:2px 0}
#panelView h3{font:700 20px var(--f);text-transform:uppercase;letter-spacing:.04em;color:var(--neon)}
#panelView .box{max-width:360px;margin:20px auto;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
#panelView .msg{color:var(--red)}#panelView .ok{color:var(--neon);font-weight:600}
#panelView .att label{display:inline;margin-right:10px;white-space:nowrap;color:var(--ink)}#panelView .att input{width:auto;margin:0 3px 0 0}
#panelView .wrap{overflow-x:auto}
#panelView .cb{margin:0 6px 8px 0;background:var(--surface2);border-color:var(--line)}#panelView .cb.on{background:var(--gold);color:#1f0e00;border-color:var(--gold)}
.tk{border:1px solid var(--line);border-left:3px solid var(--neon);background:var(--surface2);border-radius:6px;padding:10px 12px;margin-bottom:8px;font-size:15px}.stars{color:var(--gold);letter-spacing:2px}
</style>
</head>
<body>
<header><div class="w">
<a class="logo" href="#top"><img src="logo.png" alt=""><span data-n></span></a>
<nav class="top"><a href="#about" data-i="nav_about"></a><a href="#admission" data-i="nav_adm"></a><a href="#fees" data-i="nav_fee"></a><a href="#teachers" data-i="nav_tch"></a><a href="#gallery" data-i="nav_gal"></a><a href="#notices" data-i="nav_not"></a><a href="#contact" data-i="nav_con"></a></nav>
<button id="lang">English</button>
</div></header>
<div id="site"><main id="top">
<div class="hero"><div class="w">
<img class="herologo" src="logo.png" alt="NextGen Learning">
<div>
<h1 data-s="h1"></h1><p data-s="sub"></p><a class="btn" href="#admission" data-i="apply"></a>
<div class="hud"><div><b data-i="h1v"></b><span data-i="hud1"></span></div><div><b data-i="h2v"></b><span data-i="hud2"></span></div><div><b>Rajmahal</b><span data-i="hud3"></span></div></div>
</div>
</div></div>
<section id="about"><div class="w"><h2 data-i="nav_about"></h2><p data-s="about" style="white-space:pre-line;max-width:60ch"></p></div></section>
<section id="facSec" class="alt"><div class="w"><h2 id="facilities" data-i="nav_fac"></h2><ul class="chips" id="fac"></ul></div></section>
<section id="admission"><div class="w"><h2 data-i="nav_adm"></h2>
<p data-s="adm_p" class="mut"></p><ul class="chips" id="docs"></ul></div></section>
<section id="fees" class="alt"><div class="w"><h2 data-i="nav_fee"></h2>
<table><tr><th data-i="cls"></th><th data-i="adm_fee"></th><th data-i="mon_fee"></th></tr><tbody id="feerows"></tbody></table>

<section id="teachers"><div class="w"><h2 data-i="nav_tch"></h2><div class="grid" id="tch"></div></div></section>
<section id="gallery" class="alt"><div class="w"><h2 data-i="nav_gal"></h2><div class="gal" id="gal"></div></div></section>
<section id="notices"><div class="w"><h2 data-i="nav_not"></h2><div id="not"></div></div></section>

<p><b data-i="addr_l"></b><br><span id="addr"></span></p>

</main>
<footer><div class="w">© 2026 <span data-n></span> · <a class="adm" href="#" id="fl">Staff login</a></div></footer></div>
<div id="panelView" hidden><div class="w"><h2 id="ptitle"></h2><p class="mut" id="pwho" style="margin:0 0 14px"></p><div id="pmain"></div></div></div>
<nav id="bar"><button id="bHome" class="on"><span>🏠</span><i style="font-style:normal" data-i="nav_home"></i></button><button id="bExp"><span>🧭</span><i style="font-style:normal" data-i="nav_exp"></i></button><button id="bMenu"><span>🔐</span>Staff login</button></nav>
<div id="sheet" hidden><div class="sh" id="shBody"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="defaults.js"></script>
<script>
const T={hi:{nav_home:"होम",nav_exp:"मेन्यू",nav_about:"हमारे बारे में",nav_fac:"सुविधाएँ",h1v:"कक्षा 1–8",h2v:"हिंदी + English",hud1:"कक्षाएँ",hud2:"माध्यम",hud3:"स्थान",f_school:"कोचिंग",f_students:"छात्र व अभिभावक",f_media:"मीडिया",f_contact:"संपर्क",nav_adm:"एडमिशन",nav_fee:"शुल्क",nav_tch:"शिक्षक",nav_gal:"गैलरी",nav_not:"सूचना",nav_con:"संपर्क",apply:"अभी जुड़ें",cls:"कक्षा",adm_fee:"प्रवेश शुल्क",mon_fee:"मासिक शुल्क",addr_l:"पता",ph_l:"फोन",tm_l:"क्लास का समय",none:"अभी कुछ नहीं है।",lng:"English"},
en:{nav_home:"Home",nav_exp:"Menu",nav_about:"About",nav_fac:"Facilities",h1v:"Class 1–8",h2v:"Hindi + English",hud1:"Classes",hud2:"Medium",hud3:"Location",f_school:"Coaching",f_students:"Students & Parents",f_media:"Media",f_contact:"Contact",nav_adm:"Admission",nav_fee:"Fees",nav_tch:"Teachers",nav_gal:"Gallery",nav_not:"Notices",nav_con:"Contact",apply:"Join now",cls:"Class",adm_fee:"Admission fee",mon_fee:"Monthly fee",addr_l:"Address",ph_l:"Phone",tm_l:"Class timing",none:"Nothing here yet.",lng:"हिन्दी"}};
let L=localStorage.getItem('lang')||'hi',S={},D={},ME=null;
const sb=CONFIG.url.includes('YOUR-')?null:supabase.createClient(CONFIG.url,CONFIG.key);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const v=k=>(S[k]!=null&&S[k]!=='')?S[k]:DEF[k];
const lv=k=>v(k+'_'+L);
const lines=s=>String(s||'').split('\n').filter(x=>x.trim());
function paint(){
 document.documentElement.lang=L;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[L][e.dataset.i]);
 document.querySelectorAll('[data-s]').forEach(e=>e.textContent=lv(e.dataset.s));
 document.querySelectorAll('[data-n]').forEach(e=>e.textContent=v('school_name'));
 document.title=v('school_name');
 $('lang').textContent=T[L].lng;
 $('docs').innerHTML=lines(lv('docs')).map(x=>`<li>${esc(x)}</li>`).join('');
 $('feerows').innerHTML=lines(v('fees')).map(r=>{const c=r.split('|').map(s=>s.trim());return `<tr><td>${esc(c[0])}</td><td>${esc(c[1])}</td><td>${esc(c[2])}</td></tr>`}).join('');
 $('addr').textContent=v('address');
 const fcl=lines(lv('fac'));$('fac').innerHTML=fcl.map(x=>`<li>${esc(x)}</li>`).join('');$('facSec').hidden=!fcl.length;
 const p=v('phone');{const d=p.replace(/\D/g,'');$('wa').hidden=d.length<10;$('wa').href='https://wa.me/'+(d.length===10?'91'+d:d)}
$('ph').textContent=p;$('ph').href='tel:'+p.replace(/[^+\d]/g,'');
 const e=v('email');$('emp').hidden=!e;$('em').textContent=e;$('em').href='mailto:'+e;
 const none=`<p class="mut">${T[L].none}</p>`;
 $('tch').innerHTML=(D.t||[]).map(x=>`<div class="card">${x.photo_url?`<img src="${esc(x.photo_url)}" alt="">`:''}<h3>${esc(x.name)}</h3><small>${esc(x.subject)}${x.qualification?' · '+esc(x.qualification):''}</small></div>`).join('')||none;
 $('gal').innerHTML=(D.g||[]).map(x=>`<img src="${esc(x.url)}" alt="${esc(x.caption)}">`).join('')||none;
 $('not').innerHTML=(D.n||[]).map(x=>`<div class="n"><time>${esc(x.date)}</time><b>${esc(x.title)}</b><span class="mut">${esc(x.body)}</span></div>`).join('')||none;
}
$('lang').onclick=()=>{L=L==='hi'?'en':'hi';localStorage.setItem('lang',L);paint()};
async function load(){
 if(!sb)return;
 const [t,g,n,s]=await Promise.all([sb.from('teachers_public').select('*').order('created_at'),sb.from('gallery').select('*').order('created_at',{ascending:false}),sb.from('notices').select('*').order('date',{ascending:false}).limit(10),sb.from('site_settings').select('*')]);
 D={t:t.data,g:g.data,n:n.data};
 S=Object.fromEntries((s.data||[]).map(r=>[r.key,r.value]));
 paint();
}

/* ---------- Staff panel (same page) ---------- */
const POSTS=["Director","Teacher","Coordinator","Office Staff","Other"];
const ACC={admin:"Full control (Admin)",teacher:"Teacher (students, attendance, notices)",staff:"Basic (sirf notices dekhna)"};
const isAdm=()=>ME&&(ME.access==='owner'||ME.access==='admin');
const lvl=t=>ME.access==='owner'?'edit':((t==='student'?ME.fees_access:ME.salary_access)||'none');
const allowed=k=>{if(k==='fees')return lvl('student')!=='none';if(k==='salary')return lvl('employee')!=='none';return isAdm()||(ME.access==='teacher'?['students','sa','notices'].includes(k):k==='notices')};
async function fn(body){
 const {data,error}=await sb.functions.invoke('staff-admin',{body});
 if(error)throw new Error(error.message);
 if(data&&data.error)throw new Error(data.error);
 return data;
}
const STU_F=[['name','Name / नाम'],['class','Class / कक्षा','sel'],['father_name',"Parent's name / अभिभावक"],['phone','Mobile'],['address','Address'],['dob','Date of birth','date']];
const EMP_F=[['name','Name'],['post','Post','opt:Teacher|Director|Coordinator|Office Staff|Other'],['subject','Subject (teacher ke liye)'],['qualification','Qualification'],['phone','Phone'],['address','Address'],['joining_date','Joining date','date'],['show_public','Website par dikhayein?','opt:true=Haan|false=Nahi'],['photo_url','Photo (upload karein)','photo']];
const TABS={
 site:{label:'Website edit',run:siteTab},
 staff:{label:'Staff / Login',run:staffTab},
 students:{label:'Students & Tracker',run:studentsTab},
 sa:{label:'Attendance / हाज़िरी',run:()=>attendance('students','student_attendance','student_id',true)},
 ta:{label:'Staff attendance',run:()=>attendance('teachers','teacher_attendance','teacher_id',false)},
 teachers:{label:'Teachers & Staff / कर्मचारी',run:()=>crud('teachers',EMP_F,['photo_url','name','post','subject','phone'],'created_at',false,false,'employee')},
 notices:{label:'Notices / सूचना',run:()=>crud('notices',[['title','Title'],['body','Details'],['date','Date','date']],['date','title','body'],'date',true,ME.access==='staff')},
 fees:{label:'Fees / फीस',run:()=>mgmtList('student')},
 salary:{label:'Salary / वेतन',run:()=>mgmtList('employee')},
 gallery:{label:'Gallery',run:()=>crud('gallery',[['url','Photos (ek saath kai chun sakte hain)','photos'],['caption','Caption (optional)']],['url','caption'],'created_at',true)}
};

const ICON={fees:'💰',salary:'💼',site:'✏️',staff:'👥',students:'🎓',sa:'✅',ta:'🧑‍🏫',teachers:'👩‍🏫',notices:'📢',gallery:'🖼️'};
const setBar=a=>{$('bHome').classList.toggle('on',a==='home');$('bMenu').classList.toggle('on',a==='panel')};
function showSite(){$('site').hidden=false;$('panelView').hidden=true;$('sheet').hidden=true;setBar('home');window.scrollTo(0,0)}
function showPanel(){$('site').hidden=true;$('panelView').hidden=false;$('sheet').hidden=true;setBar('panel');window.scrollTo(0,0)}
const barLabel=()=>{$('bMenu').innerHTML=ME?'<span>🎮</span>Panel':'<span>🔐</span>Staff login'};
async function loadMe(){
 if(!sb)return false;
 const {data:{session}}=await sb.auth.getSession();

async function shrink(file){
 return new Promise(res=>{const img=new Image();
  img.onload=()=>{const m=1280,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(bl=>res(bl||file),'image/jpeg',0.82)};
  img.onerror=()=>res(file);img.src=URL.createObjectURL(file)});
}
async function upPhoto(file,folder){
 const b=await shrink(file);
 const ok=/^image\/(jpeg|png|webp|gif)$/;
 if(!ok.test(b.type||''))throw new Error('Ye photo format support nahi hai. JPG ya PNG photo chunein.');
 const ext=b.type==='image/png'?'png':b.type==='image/webp'?'webp':b.type==='image/gif'?'gif':'jpg';
 const p=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
 const f=new File([b],'photo.'+ext,{type:b.type});
 const {error}=await sb.storage.from('photos').upload(p,f,{contentType:b.type,cacheControl:'31536000'});
 if(error)throw error;
 return sb.storage.from('photos').getPublicUrl(p).data.publicUrl;
}
const inp=([k,l,t],pre='f_')=>{
 t=t||'text';
 if(t==='sel')return `<label>${l}<select id="${pre}${k}">${CONFIG.classes.map(c=>`<option>${c}</option>`).join('')}</select></label>`;
 if(t==='photo'||t==='photos')return `<label>${l}<input id="${pre}${k}" type="file" accept="image/*" ${t==='photos'?'multiple':''}></label>`;
 if(t.startsWith('opt:'))return `<label>${l}<select id="${pre}${k}">${t.slice(4).split('|').map(o=>{const [a,b]=o.split('=');return `<option value="${a}">${b||a}</option>`}).join('')}</select></label>`;
 return `<label>${l}<input id="${pre}${k}" type="${t}"></label>`;
};

 $('pmain').innerHTML=`<div style="background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px"><b>${stu?'Total baki fees':'Total baki salary'}: ${money(total)}</b><br><small class="mut">${cnt} ${stu?'students':'staff'} ka baki hai. Auto mode mein har mahine ki aakhri tarikh (${lastDayText()}) ko apne aap judta hai.</small></div><div class="f">${stu?`<label>Class<select id="mc"><option value="">Sab</option>${CONFIG.classes.map(c=>`<option>${c}</option>`).join('')}</select></label>`:''}<label>Search<input id="mq" placeholder="Naam"></label><label>Dikhayein<select id="mo"><option value="all">Sab</option><option value="due">Sirf jinka baki hai</option></select></label></div><div class="wrap" id="ml"></div>`;
 const draw=()=>{
  const c=stu?$('mc').value:'',q=$('mq').value.trim().toLowerCase(),o=$('mo').value;
  const list=rows.filter(r=>(!c||r.p.class===c)&&(!q||String(r.p.name).toLowerCase().includes(q))&&(o==='all'||r.due>0)).sort((a,b)=>b.due-a.due);
  $('ml').innerHTML=`<table><tr><th>Name</th><th>Monthly</th><th>Mode</th><th>Baki</th><th></th></tr>${list.map(r=>`<tr><td>${esc(r.p.name)}<br><small class="mut">${stu?esc(r.p.class)+(r.p.roll?' · Roll '+esc(r.p.roll):''):esc(r.p.post||'')}</small></td><td>${r.monthly?money(r.monthly):'-'}</td><td>${r.mode?(r.mode==='auto'?'Auto':'Manual'):'Set nahi'}</td><td style="color:${r.due>0?'var(--red)':'var(--neon)'};font-weight:600">${money(r.due)}</td><td><button data-o="${r.p.id}">Open</button></td></tr>`).join('')}</table>`;
 };
 $('pmain').querySelectorAll('select,input').forEach(x=>x.oninput=draw);draw();
 $('ml').onclick=e=>{const id=e.target.dataset.o;if(id)profile(type,id)};
}

async function profile(type,id){
 const stu=type==='student',lv=lvl(type),see=lv!=='none',ed=lv==='edit',FL=stu?STU_F:EMP_F;
 $('pmain').innerHTML='<p class="mut">Loading...</p>';
 if(see)await sb.rpc('run_accrual');
 const {data:p}=await sb.from(stu?'students':'teachers').select('*').eq('id',id).maybeSingle();
 if(!p){$('pmain').innerHTML='<p class="msg">Profile nahi mili</p>';return}
 $('ptitle').textContent=p.name;
 let acc=null,led=[];
 if(see){
  const [a,l]=await Promise.all([sb.from('accounts').select('*').eq('person_type',type).eq('person_id',id).maybeSingle(),sb.from('ledger').select('*').eq('person_type',type).eq('person_id',id).order('month',{ascending:true,nullsFirst:true}).order('created_at')]);
  acc=a.data;led=l.data||[];
 }
 let trk=[],pv=null;
 if(stu){const [a,b]=await Promise.all([sb.from('student_tracker').select('*').eq('student_id',id).order('date',{ascending:false}).order('created_at',{ascending:false}),isAdm()?sb.from('student_private').select('*').eq('student_id',id).maybeSingle():Promise.resolve({data:null})]);trk=a.data||[];pv=b.data}
 let skm={};if(stu){const {data:sk}=await sb.from('student_skills').select('skill,status').eq('student_id',id);(sk||[]).forEach(x=>{skm[x.skill]=x.status})}
 const sum=k=>led.filter(x=>x.kind===k).reduce((s,x)=>s+ +x.amount,0);
 const due=sum('charge')-sum('payment')-sum('discount');
 let pool=sum('payment')+sum('discount');const pending=[];
 led.filter(x=>x.kind==='charge').forEach(c=>{const t=Math.min(pool,+c.amount);pool-=t;const r=+c.amount-t;if(r>0)pending.push({label:c.auto?(stu?'Monthly fee':'Monthly salary')+' · '+mlabel(c.month):(c.note||'Charge')+(c.month?' · '+mlabel(c.month):''),amt:r})});
 const LB=stu?{payment:'Fee received',charge:'Extra charge',discount:'Discount / waiver'}:{payment:'Salary paid / advance',charge:'Salary due / bonus',discount:'Deduction'};
 const mode=acc?acc.mode:'auto',amt=acc?acc.monthly_amount:0,smv=(acc&&acc.start_month?acc.start_month:monthStart()).slice(0,7);
 const card='background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0';
 let details=FL.filter(f=>f[2]!=='photo').map(([k,l])=>`<tr><th>${esc(l.split(' (')[0].split(' /')[0])}</th><td>${esc(p[k])}</td></tr>`).join('');
 if(stu&&isAdm())details+=`<tr><th>Aadhar</th><td>${esc(pv&&pv.aadhar)}</td></tr>`;
 let h=`<button id="pbk">← Back</button>`;
 h+=`<div style="${card}">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="" style="height:90px;border-radius:8px;margin-bottom:8px"><br>`:''}<table>${details}</table>${isAdm()?`<p><button class="g" id="ped">Edit details</button></p><div id="pedit" hidden>${FL.map(f=>inp(f,'p_')).join('')}<button id="psv">Save details</button> <span id="pem" class="msg"></span></div>`:''}</div>`;
 if(stu){
  if(CURR[p.class])h+=`<div style="${card}"><b>Seekhne ki list: ${esc(cn(p.class))}</b><div id="sk" style="margin-top:8px"></div></div>`;
  if(isAdm())h+=`<div style="${card}"><b>Aadhar &amp; Note (sirf Owner/Admin)</b><div class="f"><label>Aadhar number<input id="pv_a" inputmode="numeric" maxlength="12" value="${esc(pv&&pv.aadhar)}"></label></div><label>Note<textarea id="pv_n" rows="3">${esc(pv&&pv.note)}</textarea></label><button id="pvs">Save</button> <span id="pvm" class="msg"></span></div>`;
  const rr=trk.filter(x=>x.rating).slice(0,3),avg=rr.length?Math.round(rr.reduce((a,x)=>a+x.rating,0)/rr.length):0;
  h+=`<div style="${card}"><b>Padhai ka record (Remarks)</b> <span style="float:right">${stars(avg)}</span><div class="f"><label>Date<input id="tk_d" type="date" value="${today()}"></label><label>Subject (optional)<input id="tk_s"></label><label>Padhai kaisi hai?<select id="tk_r">${[5,4,3,2,1].map(n=>`<option value="${n}" ${n===3?'selected':''}>${RLAB[n]}</option>`).join('')}</select></label></div><label>Kya achha hai<textarea id="tk_g" rows="2"></textarea></label><label>Kya kami hai<textarea id="tk_w" rows="2"></textarea></label><label>Aage kya karna hai<textarea id="tk_p" rows="2"></textarea></label><button id="tka">Add tracker entry</button> <span id="tkm" class="msg"></span><div id="ptr" style="margin-top:12px">${trk.length?trk.map(t=>`<div class="tk"><b>${fmt(t.date)}</b>${t.subject?' · '+esc(t.subject):''} ${stars(t.rating)}${t.good?`<br>✅ ${esc(t.good)}`:''}${t.weak?`<br>⚠️ ${esc(t.weak)}`:''}${t.plan?`<br>➡️ ${esc(t.plan)}`:''}<br><button class="r" data-td="${t.id}">Delete</button></div>`).join(''):'<p class="mut">Abhi koi entry nahi hai.</p>'}</div></div>`;
 }
 if(see){
  h+=`<div style="${card}"><small class="mut">${stu?'Baki fees':'Baki salary'}</small><div style="font:800 32px var(--f);color:${due>0?'var(--red)':'var(--neon)'}">${money(due)}</div><small class="mut">Total: ${money(sum('charge'))} · ${stu?'Mile':'Diye'}: ${money(sum('payment'))}${sum('discount')?' · '+(stu?'Discount':'Deduction')+': '+money(sum('discount')):''}</small>`;
  if(pending.length)h+=`<p style="margin:10px 0 0"><b>Pending:</b></p><table>${pending.map(r=>`<tr><td>${esc(r.label)}</td><td>${money(r.amt)}</td></tr>`).join('')}</table>`;
  h+=`<p style="margin:12px 0 0"><button data-sl="png">${stu?'Fee slip (PNG)':'Salary slip (PNG)'}</button> <button data-sl="pdf">PDF</button> <button class="g" data-sl="share">Share</button></p></div>`;
  h+=`<div style="${card}"><b>${stu?'Fee':'Salary'} setting</b><div class="f"><label>Mode<select id="acm" ${ed?'':'disabled'}><option value="auto" ${mode==='auto'?'selected':''}>Auto (mahine ki aakhri tarikh ko apne aap)</option><option value="manual" ${mode==='manual'?'selected':''}>Manual (khud entry karein)</option></select></label><label>Monthly ${stu?'fee':'salary'} (₹)<input id="aca" type="number" min="0" value="${amt}" ${ed?'':'disabled'}></label><label>Shuru ka mahina<input id="acv" type="month" value="${smv}" ${ed?'':'disabled'}></label></div>`;
  if(ed)h+=`<button id="acs">Save setting</button><p class="mut"><small>Auto mode mein shuru ke mahine se har mahine ki aakhri tarikh ko ₹ judta hai. Purana mahina chunenge to wo bhi judega. Agla auto charge: ${lastDayText()}.</small></p>`;
  h+=`</div>`;
  if(ed)h+=`<div style="${card}"><b>Nayi entry</b><div class="f"><label>Type<select id="lk"><option value="payment">${LB.payment}</option><option value="charge">${LB.charge}</option><option value="discount">${LB.discount}</option></select></label><label>Amount (₹)<input id="la" type="number" min="1"></label><label>Date<input id="ld" type="date" value="${today()}"></label><label>Note<input id="ln"></label></div><button id="lad">Add entry</button></div>`;
  h+=`<h3>Hisaab (ledger)</h3><div class="wrap" id="pled"><table><tr><th>Date</th><th>Type</th><th>Amount</th><th>Note</th>${ed?'<th></th>':''}</tr>${[...led].reverse().map(r=>`<tr><td>${r.auto?mlabel(r.month):fmt(r.paid_on||r.created_at)}</td><td>${LB[r.kind]}</td><td>${r.kind==='payment'?'−':(r.kind==='discount'?'−':'+')} ${money(r.amount)}</td><td>${esc(r.note||'')}${r.auto?' <small class="mut">(auto)</small>':''}</td>${ed?`<td>${r.auto?'':`<button class="r" data-del="${r.id}">Delete</button>`}</td>`:''}</tr>`).join('')}</table></div>`;
 }
 $('pmain').innerHTML=h;
 $('pbk').onclick=()=>openTab(lastTab);
 if(isAdm()){
  FL.forEach(([k,,t])=>{const el=$('p_'+k);if(el&&t!=='photo')el.value=p[k]==null?'':String(p[k])});
  $('ped').onclick=()=>{$('pedit').hidden=!$('pedit').hidden};
  $('psv').onclick=async()=>{
   try{
    const o={};
    for(const [k,,t] of FL){const el=$('p_'+k);if(t==='photo'){const f=el.files[0];if(f)o[k]=await upPhoto(f,'teachers');continue}const val=el.value.trim();o[k]=val===''?null:(t==='number'?+val:val)}
    const {error}=await sb.from(stu?'students':'teachers').update(o).eq('id',id);
    if(error)throw error;profile(type,id);
   }catch(x){$('pem').textContent=x.message}
  };
 }
  if(stu){
  if(stu&&CURR[p.class]&&$('sk')){
   const G=CURR[p.class],all=G.flatMap(g=>g[1]),IC={doing:'🟡 Chal raha',done:'✅ Ho gaya'},NX=CONFIG.classes[CONFIG.classes.indexOf(p.class)+1];
   const drawSk=()=>{
    const dn=all.filter(x=>skm[x[0]]==='done').length,tot=all.length,full=dn===tot;
    $('sk').innerHTML=`<p><b>${dn}/${tot}</b> complete (${Math.round(dn*100/tot)}%)</p><div style="background:var(--line);height:8px;border-radius:4px;margin-bottom:10px"><div style="background:var(--neon);height:8px;border-radius:4px;width:${dn*100/tot}%"></div></div>`
    +G.map(([g,it])=>`<p style="margin:12px 0 4px"><b>${esc(g)}</b></p>`+it.map(([k,l])=>`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(l)}</span><button class="g" data-sk="${k}">${IC[skm[k]]||'⬜ Baaki'}</button></div>`).join('')).join('')
    +(NX?`<p style="margin-top:12px">${p.class==='Class C'?'<small class="mut">Bachha jab school ke Class 6 me jaye tabhi aage bhejein.</small><br>':full?'✅ Sab complete! '+esc(cn(NX))+' me bhejne layak hai.<br>':''}${isAdm()?`<button id="prom">${esc(cn(NX))} me bhejein</button>`:(full&&p.class!=='Class C'?'<small class="mut">Admin se class badalwayein.</small>':'')}</p>`:'');
   };
   drawSk();
   $('sk').onclick=async e=>{
    const k=e.target.dataset.sk;
    if(k){const cur=skm[k],nx=!cur?'doing':cur==='doing'?'done':null;
     const r=nx?await sb.from('student_skills').upsert({student_id:id,skill:k,status:nx,updated_at:new Date().toISOString()},{onConflict:'student_id,skill'}):await sb.from('student_skills').delete().eq('student_id',id).eq('skill',k);
     if(r.error){alert(r.error.message);return}
     if(nx)skm[k]=nx;else delete skm[k];drawSk();return}
    if(e.target.id==='prom'){
     const dn=all.filter(x=>skm[x[0]]==='done').length;
     if(!confirm((dn<all.length&&p.class!=='Class C'?'Abhi sab skills complete nahi hain. ':'')+p.name+' ko '+cn(NX)+' me bhej dein?'))return;
     const {error}=await sb.from('students').update({class:NX}).eq('id',id);
     if(error)alert(error.message);else{CC=NX;profile(type,id)}
    }
   };
  }
  if($('pvs'))$('pvs').onclick=async()=>{
   const a=$('pv_a').value.replace(/\s/g,'');
   if(a&&!/^\d{12}$/.test(a)){$('pvm').textContent='Aadhar 12 ank ka hona chahiye';return}
   const {error}=await sb.from('student_private').upsert({student_id:id,aadhar:a||null,note:$('pv_n').value.trim()||null,updated_at:new Date().toISOString()},{onConflict:'student_id'});
   $('pvm').className=error?'msg':'ok';$('pvm').textContent=error?error.message:'Saved ✓';
  };
  $('tka').onclick=async()=>{
   const o={student_id:id,date:$('tk_d').value||today(),subject:$('tk_s').value.trim()||null,rating:+$('tk_r').value,good:$('tk_g').value.trim()||null,weak:$('tk_w').value.trim()||null,plan:$('tk_p').value.trim()||null};
   const {error}=await sb.from('student_tracker').insert(o);
   if(error)$('tkm').textContent=error.message;else profile(type,id);
  };
  $('ptr').onclick=async e=>{const d=e.target.dataset.td;if(d&&confirm('Ye entry hata dein?')){const {error}=await sb.from('student_tracker').delete().eq('id',d);if(error)alert(error.message);else profile(type,id)}};
  if(isAdm()&&$('ped'))$('ped').insertAdjacentHTML('afterend',' <button class="r" id="pdel">Delete student</button>'),$('pdel').onclick=async()=>{if(confirm('Ye student aur uska pura record hamesha ke liye hat jayega. Pakka?')){const {error}=await sb.from('students').delete().eq('id',id);if(error)alert(error.message);else openTab('students')}};
  }
 document.querySelectorAll('[data-sl]').forEach(b=>b.onclick=async()=>{try{await slipAct(b.dataset.sl,type,p,pending,due)}catch(x){alert(x.message)}});
 if(see&&ed){
  $('acs').onclick=async()=>{
   const {error}=await sb.from('accounts').upsert({person_type:type,person_id:id,mode:$('acm').value,monthly_amount:+$('aca').value||0,start_month:($('acv').value||monthStart().slice(0,7))+'-01'},{onConflict:'person_type,person_id'});
   if(error){alert(error.message);return}
   await sb.rpc('run_accrual');profile(type,id);
  };
  $('lad').onclick=async()=>{
   const amount=+$('la').value;if(!(amount>0)){alert('Amount daalein');return}
   const k=$('lk').value,d=$('ld').value||today();
   const {error}=await sb.from('ledger').insert({person_type:type,person_id:id,kind:k,amount,paid_on:d,month:k==='payment'?null:d.slice(0,7)+'-01',note:$('ln').value.trim()||null});
   if(error)alert(error.message);else profile(type,id);
  };
  $('pled').onclick=async e=>{const d=e.target.dataset.del;if(d&&confirm('Ye entry hata dein?')){const {error}=await sb.from('ledger').delete().eq('id',d);if(error)alert(error.message);else profile(type,id)}};
 }
}

/* ---------- Slip (PNG / PDF / Share) ---------- */
async function makeSlip(type,p,pending,due){
 const stu=type==='student';
 try{await document.fonts.load('700 28px "Noto Sans Devanagari"');await document.fonts.load('600 22px "Plus Jakarta Sans"')}catch(e){}
 const W=800,rows=pending.slice(0,10),H=700+rows.length*40+(pending.length>10?40:0);
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 const F=(w,s)=>`${w} ${s}px "Plus Jakarta Sans","Noto Sans Devanagari",sans-serif`;
 x.fillStyle='#fff';x.fillRect(0,0,W,H);
 x.fillStyle='#0F1630';x.fillRect(0,0,W,130);
 const lg=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src='logo.png'});
 if(lg){const sz=104,ar=lg.width/lg.height;x.drawImage(lg,W-40-sz*ar,13,sz*ar,sz)}
 x.fillStyle='#fff';x.font=F(800,34);x.fillText(v('school_name'),40,60);
 x.fillStyle='#C9D2F0';x.font=F(500,20);x.fillText(v('address')+' · '+v('phone'),40,98);
 x.fillStyle='#1B2B63';x.font=F(800,30);x.fillText(stu?'FEE REMINDER · फीस रिमाइंडर':'SALARY STATEMENT · वेतन विवरण',40,190);
 x.fillStyle='#5A6080';x.font=F(500,20);x.textAlign='right';x.fillText('Date: '+fmt(today()),W-40,190);x.textAlign='left';
 const DL=stu?[['Name',p.name],['Class / Roll',(p.class||'')+(p.roll?' / '+p.roll:'')],["Father's name",p.father_name],['Phone',p.phone]]:[['Name',p.name],['Post',p.post],['Phone',p.phone]];
 let y=240;
 DL.forEach(([a,b])=>{x.fillStyle='#5A6080';x.font=F(500,21);x.fillText(a,40,y);x.fillStyle='#0F1630';x.font=F(600,23);x.fillText(String(b||'-'),260,y);y+=40});
 y+=10;
 x.fillStyle=due>0?'#8B2E2E':'#1B2B63';x.fillRect(40,y,W-80,92);
 x.fillStyle='#fff';x.font=F(600,22);x.fillText(due>0?(stu?'TOTAL DUE · कुल बकाया':'SALARY PAYABLE · देय वेतन'):'NO DUE · कोई बकाया नहीं',60,y+34);
 x.font=F(800,38);x.fillText(money(Math.max(due,0)),60,y+76);
 y+=132;
 if(rows.length){
  x.fillStyle='#1B2B63';x.font=F(800,21);x.fillText('Pending · बकाया विवरण',40,y);
  rows.forEach(r=>{y+=40;x.fillStyle='#0F1630';x.font=F(500,21);x.fillText(r.label,40,y);x.textAlign='right';x.fillText(money(r.amt),W-40,y);x.textAlign='left';x.strokeStyle='#D9DDEE';x.beginPath();x.moveTo(40,y+12);x.lineTo(W-40,y+12);x.stroke()});
  if(pending.length>10){y+=40;x.fillStyle='#5A6080';x.font=F(500,20);x.fillText('+ '+(pending.length-10)+' aur mahine',40,y)}
 }
 y+=56;
 if(stu&&due>0){x.fillStyle='#0F1630';x.font=F(600,21);x.fillText('कृपया बकाया शुल्क जल्द से जल्द जमा करें।',40,y);y+=34;x.fillStyle='#5A6080';x.font=F(500,19);x.fillText('Please deposit the pending fees at the coaching office.',40,y)}
 x.fillStyle='#5A6080';x.font=F(500,19);x.fillText('Authorised signature',W-300,H-34);
 x.strokeStyle='#5A6080';x.beginPath();x.moveTo(W-320,H-62);x.lineTo(W-40,H-62);x.stroke();
 return c;
}
const loadJsPdf=()=>window.jspdf?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=res;s.onerror=()=>rej(new Error('PDF library load nahi hui, internet check karein'));document.head.appendChild(s)});
async function slipAct(kind,type,p,pending,due){
 const c=await makeSlip(type,p,pending,due);
 const base=(type==='student'?'fee-slip-':'salary-')+String(p.name||'').trim().replace(/\s+/g,'-');
 const blob=await new Promise(r=>c.toBlob(r,'image/png'));
 const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
 if(kind==='png')dl(blob,base+'.png');
 else if(kind==='share'){
  const f=new File([blob],base+'.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:base});else dl(blob,base+'.png');
 }else{
  await loadJsPdf();const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:'px',format:[c.width,c.height],orientation:'portrait'});
  pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,c.width,c.height);pdf.save(base+'.pdf');
 }
}


if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
paint();load();
loadMe().then(ok=>{if(location.hash==='#panel'){ok?goFirst():showLogin()}});
</script>
