async function showExam(code0){
 document.body.classList.add('pubmode');
 $('site').hidden=true;$('admView').hidden=true;$('panelView').hidden=true;$('sheet').hidden=true;$('pubView').hidden=true;$('feView').hidden=true;$('exView').hidden=false;window.scrollTo(0,0);
 const B=$('exBody'),home=`<p style="margin-top:20px;text-align:center"><button class="g" id="exhome">← ${esc(v('school_name'))} website</button></p>`;
 const goHome=()=>{window.onbeforeunload=null;location.hash='';showSite()};
 const entry=()=>{
  B.innerHTML=`<div class="hx"><div class="em">📝</div><h2>Online Exam</h2><p>Exam number daalkar apna test dein</p></div><div class="fc"><label>Exam number<input id="xe_c" class="big" inputmode="numeric" maxlength="8" value="${esc(code0||'')}" placeholder="••••••"></label><label>Aapka naam<input id="xe_n" autocomplete="name" placeholder="Poora naam"></label><label>Roll no <small class="mut">(agar pata ho)</small><input id="xe_r" inputmode="numeric" placeholder="Jaise: 12"></label><button class="bigb" id="xe_go">Exam shuru karein →</button><p class="msg" id="xe_m" style="text-align:center;margin:10px 0 0"></p></div><ul class="tips"><li>⏱ Timer chalega. Time khatam hone par exam apne aap jama ho jayega.</li><li>📵 Exam ke beech page refresh na karein.</li><li>☑️ Har sawal ka ek hi sahi jawab hota hai.</li></ul>`+home;
  $('exhome').onclick=goHome;
  $('xe_go').onclick=async()=>{
   const c=$('xe_c').value.trim(),nm=$('xe_n').value.trim(),rl=$('xe_r').value.trim();
   if(!/^\d{4,8}$/.test(c)){$('xe_m').textContent='Sahi Exam number daalein';return}
   if(nm.length<2){$('xe_m').textContent='Apna naam likhein';return}
   $('xe_m').className='ok';$('xe_m').textContent='Exam khul raha hai...';
   const {data:ex,error}=await sb.rpc('exam_public',{c});
   if(error||!ex){$('xe_m').className='msg';$('xe_m').textContent='Exam number galat hai ya exam abhi chalu nahi hai';return}
   run(ex,c,nm,rl);
  };
 };
 const run=(ex,c,nm,rl)=>{
  const items=ex.items||[],ANS=items.map(()=>null),L='ABCD',end=Date.now()+(+ex.minutes||30)*60000;let fin=false,tmr;
  window.onbeforeunload=()=>'Exam chal raha hai';
  B.innerHTML=`<div class="xbar"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${esc(ex.title||'Exam')} · ${esc(ex.subject)}</b><span class="pill" id="xt">--:--</span></div><div class="pgb"><div id="xpb" style="width:0%"></div></div><small class="mut" id="xp">0 / ${items.length} jawab diye</small></div><p class="mut" style="margin:0 0 10px"><small>👤 ${esc(nm)}${rl?' · Roll '+esc(rl):''} · ${esc(cn(ex.class))}</small></p>${items.map((q,i)=>`<div class="xq"><div class="xqh"><span class="xn">${i+1}</span><b>${esc(q.q)}</b></div>${(q.o||[]).map((o,j)=>`<label class="xo"><input type="radio" name="q${i}" value="${j}"><span class="xl">${L[j]}</span><span>${esc(o)}</span></label>`).join('')}</div>`).join('')}<button class="bigb" id="xs">✅ Exam jama karein</button><p class="msg" id="xm" style="text-align:center"></p>`;
  B.onchange=e=>{const m=e.target.name&&e.target.name.match(/^q(\d+)$/);if(m){ANS[+m[1]]=+e.target.value;const k=ANS.filter(x=>x!==null).length;$('xp').textContent=k+' / '+items.length+' jawab diye';$('xpb').style.width=(k*100/items.length)+'%';e.target.closest('.xq').querySelectorAll('.xo').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked))}};
  const tick=()=>{const left=Math.max(0,Math.round((end-Date.now())/1000));$('xt').textContent='⏱ '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0&&!fin)submit(true)};
  tick();tmr=setInterval(tick,1000);
  const submit=async auto=>{
   if(fin)return;const un=ANS.filter(x=>x===null).length;
   if(!auto&&un&&!confirm(un+' sawal chhoot gaye hain. Phir bhi jama karein?'))return;
   fin=true;clearInterval(tmr);$('xs').disabled=true;$('xm').className='ok';$('xm').textContent='Jama ho raha hai...';
   const {data:r,error}=await sb.rpc('exam_submit',{c,nm,rl,ans:ANS});
   window.onbeforeunload=null;
   if(error||!r||r.error){fin=false;$('xs').disabled=false;const k=r&&r.error;$('xm').className='msg';$('xm').textContent=k==='dup'?'Is naam aur roll se exam pehle de diya ja chuka hai.':k==='closed'?'Exam band ho chuka hai.':'Jama nahi hua, internet check karke dobara dabayein.';if(k)clearInterval(tmr);return}
   B.onchange=null;const pct=Math.round(r.score*100/r.total),msg=pct>=80?'Shabash! 🌟':pct>=50?'Achha prayas! 👍':'Aur mehnat karein 💪';
   B.innerHTML=`<div class="hx"><div class="em">${pct>=80?'🏆':pct>=50?'🎉':'💪'}</div><h2>${msg}</h2><p>${esc(nm)}</p></div><div class="fc" style="text-align:center"><div class="ring" style="--p:${pct}"><div><b>${r.score}/${r.total}</b><small class="mut">${pct}%</small></div></div>${r.max>r.total?`<p>Kul number: <b>${r.marks} / ${r.max}</b></p>`:''}<p class="ok">✅ Aapka result save ho gaya hai.</p></div>`
   +(r.review?`<h3 style="margin:18px 0 8px">Jawab dekhein</h3>${items.map((q,i)=>{const rv=r.review[i]||{},ok=rv.y===rv.c;return `<div class="xq rv ${ok?'ok':'no'}"><div class="xqh"><span class="xn">${i+1}</span><b>${esc(q.q)}</b></div><p style="margin:4px 0">${ok?'✅':'❌'} Aapka jawab: ${rv.y===null||rv.y===undefined?'chhoda':'('+L[rv.y]+') '+esc((q.o||[])[rv.y])}</p>${ok?'':`<p style="margin:0;color:#16A34A;font-weight:700">Sahi jawab: (${L[rv.c]}) ${esc((q.o||[])[rv.c])}</p>`}</div>`}).join('')}`:'')+home;
   $('exhome').onclick=goHome;window.scrollTo(0,0);
  };
  $('xs').onclick=()=>submit(false);
 };
 entry();
}

async function shrink(file){
 return new Promise(res=>{const img=new Image();
  img.onload=()=>{const m=1280,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(bl=>res(bl||file),'image/jpeg',0.82)};
  img.onerror=()=>res(file);img.src=URL.createObjectURL(file)});
}
async function upPhoto(file,folder){
 const b=await shrink(file);
 const ok=/^image\/(jpeg|png|webp|gif)$/;
 if(!ok.test(b.type||''))throw new Error('Ye photo format support nahi hai. JPG ya PNG photo chunein.');
 const ext=b.type==='image/png'?'png':b.type==='image/webp'?'webp':b.type==='image/gif'?'gif':'jpg';
 const p=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
 const f=new File([b],'photo.'+ext,{type:b.type});
 const {error}=await sb.storage.from('photos').upload(p,f,{contentType:b.type,cacheControl:'31536000'});
 if(error)throw error;
 return sb.storage.from('photos').getPublicUrl(p).data.publicUrl;
}
const inp=([k,l,t],pre='f_')=>{
 t=t||'text';
 if(t==='sel')return `<label>${l}<select id="${pre}${k}">${CONFIG.classes.map(c=>`<option>${c}</option>`).join('')}</select></label>`;
 if(t==='photo'||t==='photos')return `<label>${l}<input id="${pre}${k}" type="file" accept="image/*" ${t==='photos'?'multiple':''}></label>`;
 if(t.startsWith('opt:'))return `<label>${l}<select id="${pre}${k}">${t.slice(4).split('|').map(o=>{const [a,b]=o.split('=');return `<option value="${a}">${b||a}</option>`}).join('')}</select></label>`;
 return `<label>${l}<input id="${pre}${k}" type="${t}"></label>`;
};
async function crud(table,fields,cols,order,desc,ro,prof){
 const m=$('pmain');
 m.innerHTML=(ro?'':`<div class="f">${fields.map(f=>inp(f)).join('')}</div><button id="add">Add / जोड़ें</button> <span class="msg" id="e"></span>`)+`<h3>List</h3><div class="wrap" id="lst">Loading...</div>`;
 if(!ro)$('add').onclick=async()=>{
  const btn=$('add'),msg=$('e');msg.className='msg';
  try{
   const o={};let files=[],pk=null;
   for(const [k,,t] of fields){
    if(t==='photo'||t==='photos'){pk=k;files=[...$('f_'+k).files];continue}
    const val=$('f_'+k).value.trim();if(val)o[k]=t==='number'?+val:val}
   if(table==='gallery'&&!files.length)throw new Error('Pehle photo chunein');
   btn.disabled=true;msg.textContent='Upload ho raha hai, thoda ruko...';
   if(pk&&files.length){
    const rows=[];for(const f of files)rows.push({...o,[pk]:await upPhoto(f,table)});
    const {error}=await sb.from(table).insert(rows);if(error)throw error;
   }else{const {error}=await sb.from(table).insert(o);if(error)throw error}
   crud(table,fields,cols,order,desc,ro,prof);
  }catch(x){btn.disabled=false;msg.textContent=x.message}
 };
 const {data,error}=await sb.from(table).select('*').order(order,{ascending:!desc});
 if(error){$('lst').textContent=error.message;return}
 const cell=(r,c)=>(c==='url'||c==='photo_url')?(r[c]?`<img src="${esc(r[c])}" alt="" style="height:48px;border-radius:4px">`:''):esc(r[c]);
 const act=!ro||prof;
 $('lst').innerHTML=`<table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}${act?'<th></th>':''}</tr>${data.map(r=>`<tr>${cols.map(c=>`<td>${cell(r,c)}</td>`).join('')}${act?`<td>${prof?`<button class="g" data-p="${r.id}">Profile</button> `:''}${ro?'':`<button class="r" data-id="${r.id}">Delete</button>`}</td>`:''}</tr>`).join('')}</table>`;
 $('lst').onclick=async e=>{
  const d=e.target.dataset;
  if(d.p){profile(prof,d.p);return}
  if(ro||!d.id)return;
  if(confirm('Delete karein?')){
   const r=data.find(x=>x.id===d.id);const u=(r&&(r.url||r.photo_url))||'';const i=u.indexOf('/photos/');
   if(i>-1)await sb.storage.from('photos').remove([decodeURIComponent(u.slice(i+8))]);
   await sb.from(table).delete().eq('id',d.id);crud(table,fields,cols,order,desc,ro,prof)}
 };
}
async function attendance(list,att,idCol,byClass){

function parseMCQ(t){
 const out=[];
 String(t).split(/\n\s*\n/).forEach(bk=>{
  const L=bk.split('\n').map(x=>x.trim()).filter(Boolean),q=[],o=[];let a=-1;
  L.forEach(l=>{
   const am=l.match(/^(?:ans(?:wer)?|उत्तर)\s*[:\-]?\s*\(?([A-Da-d1-4])\)?/i),om=l.match(/^\(?([A-Da-d])[).:]\s*(.+)$/);
   if(am){const c=am[1].toUpperCase();a=/\d/.test(c)?+c-1:'ABCD'.indexOf(c)}
   else if(om&&o.length<4&&'ABCD'.indexOf(om[1].toUpperCase())===o.length)o.push(om[2]);
   else if(!o.length)q.push(l.replace(/^\d+[).\s]+/,''));
  });
  if(q.length&&o.length===4&&a>=0)out.push({q:q.join(' '),o,a});
 });
 return out;
}

/* ---------- Management: fees & salary ---------- */
const money=n=>'₹ '+Number(n||0).toLocaleString('en-IN');
const fmt=d=>d?String(d).slice(0,10).split('-').reverse().join('-'):'';
const mlabel=d=>d?new Date(String(d).slice(0,7)+'-01T00:00:00').toLocaleDateString('en-IN',{month:'short',year:'numeric'}):'';
const monthStart=()=>today().slice(0,7)+'-01';
const next25=()=>{const n=new Date();let m=n.getMonth();if(n.getDate()>=25)m++;return new Date(n.getFullYear(),m,25).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};
const lastDayText=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth()+1,0).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};

async function mgmtList(type){

 };

const loadJsPdf=()=>window.jspdf?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=res;s.onerror=()=>rej(new Error('PDF library load nahi hui, internet check karein'));document.head.appendChild(s)});
async function slipAct(kind,type,p,pending,due){
 const c=await makeSlip(type,p,pending,due);
 const base=(type==='student'?'fee-slip-':'salary-')+String(p.name||'').trim().replace(/\s+/g,'-');
 const blob=await new Promise(r=>c.toBlob(r,'image/png'));
 const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
 if(kind==='png')dl(blob,base+'.png');
 else if(kind==='share'){
  const f=new File([blob],base+'.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:base});else dl(blob,base+'.png');
 }else{
  await loadJsPdf();const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:'px',format:[c.width,c.height],orientation:'portrait'});
  pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,c.width,c.height);pdf.save(base+'.pdf');
 }
}
